name: Notify nvim-config

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    name: request focused lock refresh
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.release.prerelease == false)
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch exact MCP Buff commit
        env:
          GH_TOKEN: ${{ secrets.NVIM_CONFIG_DISPATCH_TOKEN }}
          PLUGIN_COMMIT: ${{ github.sha }}
          PLUGIN_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_SOURCE: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error title=nvim-config dispatch unavailable::Configure NVIM_CONFIG_DISPATCH_TOKEN to enable cross-repository lock refreshes."
            exit 1
          fi
          gh api --method POST repos/777lotto/nvim-config/dispatches \
            --raw-field event_type=plugin-release \
            --field 'client_payload[plugin]=mcp-buff' \
            --field "client_payload[commit]=$PLUGIN_COMMIT" \
            --field "client_payload[tag]=${PLUGIN_TAG:-$DISPATCH_SOURCE}"
